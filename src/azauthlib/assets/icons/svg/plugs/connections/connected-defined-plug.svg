      <rect width="733" height="732" fill="#FFFFFF"/>
      <g id="male-housing-lines" transform="translate(-58.5 51.5) translate(466 274) rotate(45)" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
