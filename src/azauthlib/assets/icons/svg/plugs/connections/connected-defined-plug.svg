        <path id="male-housing-lines-grip-left" d="M-36 -25V19"/>
        <path id="male-housing-lines-grip-right" d="M0 -25V19"/>
        <path id="male-housing-lines-housing-contour" d="M36 -25V19"/>
        <path id="male-housing-lines-strain-relief-1" d="M-26 -138H26"/>
        <path id="male-housing-lines-strain-relief-2" d="M-26 -117H26"/>
        <path id="male-housing-lines-strain-relief-3" d="M-26 -96H26"/>
      </g>
      <g id="female-housing-lines" transform="translate(58.5 -51.5) translate(268.389827 457.610173) rotate(45)" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path id="female-housing-lines-face-seam" d="M-72 -18 L72 -18"/>
        <path id="female-housing-lines-grip-left" d="M-36 7V48"/>
        <path id="female-housing-lines-grip-right" d="M0 7V48"/>
        <path id="female-housing-lines-housing-contour" d="M36 7V48"/>
        <path id="female-housing-lines-strain-relief-1" d="M-26 95H26"/>
        <path id="female-housing-lines-strain-relief-2" d="M-26 116H26"/>
        <path id="female-housing-lines-strain-relief-3" d="M-26 138H26"/>
      </g>
    </mask>
    <mask id="electrical-plug-definition" maskUnits="userSpaceOnUse" x="0" y="0" width="494" height="437" style="mask-type:luminance">
      <rect width="494" height="437" fill="#FFFFFF"/>
      <g id="upper-electrical-housing" transform="translate(316 147) rotate(45)" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path id="upper-electrical-housing-housing-seam" d="M-43 30 L43 30"/>
        <path id="upper-electrical-housing-side-contour" d="M32 -25 L32 11"/>
        <path id="upper-electrical-housing-cable-collar" d="M-9 -52 L9 -52"/>
