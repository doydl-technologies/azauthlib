        <path id="lower-electrical-housing-face-seam" d="M-47 -30 L47 -30"/>
        <path id="lower-electrical-housing-rear-seam" d="M-31 46 L31 46"/>
        <path id="lower-electrical-housing-cable-collar" d="M-10 67 L10 67"/>
      </g>
      <g id="electrical-plug-openings" fill="#000000">
