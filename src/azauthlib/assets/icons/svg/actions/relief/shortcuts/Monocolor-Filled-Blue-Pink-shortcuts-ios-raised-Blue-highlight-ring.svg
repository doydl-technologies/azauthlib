<path  d="M50.36,34.354a1.489,1.489,0,0,1-.859-.272L32.778,22.375A4.826,4.826,0,0,0,30,21.5a1.5,1.5,0,0,1,0-3,7.818,7.818,0,0,1,4.5,1.417L51.222,31.625a1.5,1.5,0,0,1-.862,2.729Z" fill="#8d9cf4" />
<path  d="M30,41.5a7.818,7.818,0,0,1-4.5-1.417L8.778,28.375A1.5,1.5,0,0,1,10.5,25.918L27.222,37.625A4.826,4.826,0,0,0,30,38.5a1.5,1.5,0,0,1,0,3Z" fill="#f28080" />
</g>
</g>
</svg>
