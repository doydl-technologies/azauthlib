<path  d="M30,53.5a7.818,7.818,0,0,1-4.5-1.417L8.778,40.375a5.34,5.34,0,0,1,0-8.75L25.5,19.918a7.972,7.972,0,0,1,9,0h0L51.222,31.625a5.34,5.34,0,0,1,0,8.75L34.5,52.082A7.811,7.811,0,0,1,30,53.5Zm0-32a4.825,4.825,0,0,0-2.779.876L10.5,34.082a2.341,2.341,0,0,0,0,3.836L27.222,49.625a4.921,4.921,0,0,0,5.557,0L49.5,37.918a2.341,2.341,0,0,0,0-3.836L32.779,22.376A4.825,4.825,0,0,0,30,21.5Z" fill="#8d9cf4" />
<path  d="M30,20a6.338,6.338,0,0,0-3.638,1.147L13.714,30l12.648,8.853a6.343,6.343,0,0,0,7.276,0L46.286,30,33.638,21.147A6.338,6.338,0,0,0,30,20Z" fill="#f2bdd6" />
<path  d="M30,41.5a7.813,7.813,0,0,1-4.5-1.417L12.854,31.229a1.5,1.5,0,0,1,0-2.458L25.5,19.918a7.972,7.972,0,0,1,9,0l12.647,8.854a1.5,1.5,0,0,1,0,2.458L34.5,40.082A7.807,7.807,0,0,1,30,41.5ZM16.33,30l10.892,7.625a4.921,4.921,0,0,0,5.557,0L43.67,30,32.778,22.375a4.921,4.921,0,0,0-5.557,0Z" fill="#bf95bc" />
