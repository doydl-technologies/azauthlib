<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="734.5" height="165.25" viewBox="798.25 101.25 734.5 165.25">
  <!-- Qt-compatible copy of azauthlib-wordmark.svg; original artwork preserved. -->
  <title>Editable azauthlib logo mockup</title>
  <desc>azauthlib lockup vector markup replaces the former Dately lockup; remaining elements stay editable.</desc>
  
  <g id="wordmark" aria-label="azauthlib">
    <g id="azauthlib-lockup" aria-label="azauthlib" transform="translate(513.709363 8.583541) scale(0.889594196)" fill="none"><title id="title">azauthlib wordmark</title>
  <desc id="desc">A horizontal wordmark for azauthlib with a secure authentication shield mark and outlined lettering.</desc>
  <defs>
    <linearGradient id="pythonBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22A4FD" />
      <stop offset="1" stop-color="#1D9CFB" />
    </linearGradient>
    <linearGradient id="pythonYellowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD84A" />
      <stop offset="1" stop-color="#FBCD3B" />
    </linearGradient>
    <filter id="pythonBadgeShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#061735" flood-opacity="0.52" />
    </filter>
    <linearGradient id="shieldGrad" x1="70" y1="320" x2="320" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1B2A" />
      <stop offset="1" stop-color="#17304F" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="116" y1="230" x2="286" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FA7FF" />
      <stop offset="1" stop-color="#35D0BA" />
    </linearGradient>
    <style>
      /*
        --wordmark-tracking controls progressive letter offsets in SVG units.
        Zero uses the base positions; positive values expand the spacing and
        negative values tighten it. The badge follows the final letter.
      */
      #azauthlib-wordmark { --wordmark-tracking: -8px; }
    </style>
  </defs>


  

