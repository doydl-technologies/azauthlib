  </g>

  <script>
    (() =&gt; {
      const wordmark = document.getElementById('azauthlib-wordmark');
      const letters = wordmark.querySelectorAll('.wordmark-letter');
      const pythonBadge = document.getElementById('python-badge-trailer');

      function applyWordmarkTracking() {
        const raw = getComputedStyle(wordmark)
          .getPropertyValue('--wordmark-tracking')
          .trim();

        const tracking = parseFloat(raw) || 0;

        // Each letter moves progressively, producing adjustable tracking
        // without modifying any of the original path geometry.
        letters.forEach((letter, index) =&gt; {
          letter.setAttribute('transform', `translate(${tracking * index} 0)`);
        });

        // The badge trails the wordmark by following the same displacement
        // as the final azauthlib letter. There are 9 letters, so the last
        // letter has index 8 and moves by tracking * 8.
        const lastLetterIndex = Math.max(letters.length - 1, 0);
        pythonBadge.setAttribute(
          'transform',
          `translate(${tracking * lastLetterIndex} 0)`
        );
      }

      applyWordmarkTracking();
    })();
  </script>

</g></g>
  </svg>
