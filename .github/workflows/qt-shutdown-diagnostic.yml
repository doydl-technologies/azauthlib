name: Qt shutdown diagnostic

on:
  push:
    branches: [fix/qt-shutdown]

permissions:
  contents: read

jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        qt: ["6.12.0", "6.11.2"]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: python -m pip install -e ".[dev]" "PySide6==${{ matrix.qt }}"
      - name: Measure None references without application code
        run: |
          python - <<'PY'
          import subprocess
          import sys

          code = '''
          import json, sys
          import PySide6
          from PySide6.QtCore import QObject
          obj = QObject()
          method = obj.setObjectName
          for _ in range(10):
              method("warmup")
          before = sys.getrefcount(None)
          for _ in range(1000):
              method("probe")
          after = sys.getrefcount(None)
          print(json.dumps({"qt": PySide6.__version__, "before": before,
                            "after": after, "delta": after-before}), flush=True)
          '''
          result = subprocess.run([sys.executable, "-c", code], capture_output=True, text=True)
          print(result.stdout, flush=True)
          print("Probe exit:", result.returncode, flush=True)
          print(result.stderr, flush=True)
          PY
      - name: Validate the candidate binding
        if: matrix.qt == '6.11.2'
        run: pytest
