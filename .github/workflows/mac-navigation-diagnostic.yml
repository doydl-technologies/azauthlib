name: macOS navigation diagnostic

on:
  push:
    branches: [fix/qt-shutdown]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        qt: ["6.12.0", "6.11.2"]
    env:
      PYTHONUNBUFFERED: "1"
      QT_SCALE_FACTOR: "0.85"
      QT_QUICK_CONTROLS_STYLE: Basic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade build twine pytest
      - run: python .github/desktop/ci_prepare.py --artifacts ci-artifacts
      - name: Select diagnostic Qt version
        run: python -m pip install --upgrade --target ci-artifacts/installed "PySide6==${{ matrix.qt }}"
      - name: Native installed-wheel navigation checks
        run: python .github/desktop/gui_smoke.py --installed ci-artifacts/installed --artifacts ci-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-navigation-qt-${{ matrix.qt }}
          path: |
            ci-artifacts/*.log
            ci-artifacts/*.json
            ci-artifacts/screenshots/
