[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "azauthlib"
dynamic = ["version"]
description = "Secure Microsoft identity platform authentication helpers built on MSAL"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "DOYDL Technologies" }]
keywords = ["azure", "entra", "microsoft-graph", "msal", "oauth2", "authentication"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "certifi>=2026.10.19",
  "keyring>=25,<26",
  "msal>=1.31,<2",
  "msal-extensions>=1.2,<2",
  "platformdirs>=4,<5",
  "portalocker>=2.10,<4",
  "PySide6>=6.8,<7",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "resvg_py>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
  "setuptools>=83",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/doydl-technologies/azauthlib"
Issues = "https://github.com/doydl-technologies/azauthlib/issues"
Repository = "https://github.com/doydl-technologies/azauthlib"
Changelog = "https://github.com/doydl-technologies/azauthlib/blob/main/CHANGELOG.md"

[project.scripts]
azauthlib-app = "azauthlib.gui.config_app:main"

[tool.setuptools.dynamic]
version = { attr = "azauthlib.__version__" }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["azauthlib", "azauthlib.*"]
namespaces = false

[tool.setuptools.package-data]
azauthlib = [
  "assets/**/*.png",
  "assets/**/*.ico",
  "assets/**/*.svg",
  "assets/fonts/*.ttf",
  "assets/fonts/*-OFL.txt",
  "assets/docs/legal/*.md",
  "assets/docs/legal/*.html",
  "gui/qml/*.qml",
  "gui/qml/components/*.qml",
  "gui/qml/shaders/*.frag",
  "gui/qml/shaders/*.qsb",
  "gui/qml/theme/*.qml",
  "gui/qml/theme/qmldir",
]

[tool.setuptools.exclude-package-data]
azauthlib = [
  "**/.dormant/*",
  "**/.docs/*",
  "**/.scripts/*",
  "assets/icons/svg/third-party/*",
  "UI_IMPLEMENTATION_NOTES.md",
  "gui/qml/_Search-Qml.cmd-",
  "gui/qml/_Search-Qml.ps1-",
  "gui/qml/Search-Qml.cmd",
  "gui/qml/Search-Qml.ps1",
  "gui/qml/Search-Qml.settings.json",
  "gui/qml/.repoSearch.settings.json",
  "gui/qml/repoSearch",
  "gui/qml/repoSearch.cmd",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=azauthlib --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S603", "UP009"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.coverage.run]
# Desktop behavior is checked separately; keep the same scope for installed wheels.
omit = ["*/azauthlib/gui/*"]

[tool.bandit]
exclude_dirs = ["tests", ".scripts", ".dormant"]
